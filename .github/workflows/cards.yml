####################################################################
#  Save this file at:  .github/workflows/cards.yml
#  in your  pruthvi4344/pruthvi4344  profile repo.
#
#  Settings -> Actions -> General -> Workflow permissions
#  must be set to "Read and write permissions".
#
#  Run it once manually (Actions tab -> Update README cards ->
#  Run workflow) so the SVGs exist before anyone loads your README.
####################################################################

name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"    # once a day
  workflow_dispatch:        # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&bg_color=0D1117&title_color=00F7FF&icon_color=00F7FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=00F7FF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
