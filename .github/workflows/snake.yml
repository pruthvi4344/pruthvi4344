####################################################################
#  Save this file at:  .github/workflows/snake.yml
#  in your  pruthvi4344/pruthvi4344  profile repo.
#
#  After the first run, Settings → Actions → General →
#  Workflow permissions → "Read and write permissions" must be ON.
####################################################################

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pruthvi4344
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
